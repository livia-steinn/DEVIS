<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  </head>
    <title>Carousel</title>
</head>
<body>
    <h1 class="bg-success p-4 text-white">Personagens</h1>
    <section id="Carousel-Personagens" class="carousel slide m-4 p-4" data-bs-ride="carousel">
        <article class="carousel-inner">
            <aside class="carousel-item active" data-bs-interval="2000">
                <img src="img/woody.jpg" alt="Xerife Woody" class="d-block w-100" >
            </aside>
            <aside class="carousel-item" data-bs-interval="2000">
                <img src="img/buzz.jpg" alt="Buzz" class="d-block w-100" >
            </aside>
            <aside class="carousel-item" data-bs-interval="2000">
                <img src="img/jessie.jpg" alt="Jessie" class="d-block w-100" >
            </aside>
        </article>
    </section>

    <h1>Badges</h1>
    <h2>Woody</h2>
    <p>Woody <span class="badge text-bg-warning">Xerife</span></p>
    <h2>Buzz Lightyear </h2>
    <p>Buzz Lightyear <span class="badge text-bg-success">Patrulheiro Espacial</span></p>
    <h2>Jessie</h2>
    <p>Jessie <span class="badge text-bg-danger">Cowgirl</span></p>


    <h1>Alertas</h1>
    <section class="alert alert-warning" role="alert">Woody - Xerife Local do Pizza Planet</section>
    <section class="alert alert-success" role="alert">Buzz Lightyear - Patrulheiro Espacial das Galáxias</section>
    <section class="alert alert-danger" role="alert">Jessie - Ajudante do Xerife Woody</section>







    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
</body>
</html>
