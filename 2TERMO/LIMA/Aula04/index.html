<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- icone favorito -->
    <link rel="shortcut icon" href="imagens/homerosa.png" type="image/x-icon">
    <title>FAVICONS e IMAGENS</title>
</head>
<body style="">
<h1><i>Imagens do Google</i></h1>
<h2><i>Elsa:</i></h2>
<!-- tag para acrescentar imagens -->
    <img src="imagens/olaf.imagem.png" alt="Frozen" title="Frozen" align="left" ">
<H2>Elsa - com proporção de imagens</H2>

 <div>
    <img src="imagens/olaf.imagem.jpg" alt="Frozen" title="Frozen - Olaf"
        width="300px" 
        height="300px"
        border-radius: 10px>
</div>

<h2> Elsa - com proporção de imagens</h2>
 <div>    
    <img src="imagens/olaf.imagem.jpg" alt="Frozen" title="Frozen - Olaf" 
    style="margin:20px; position: absolute;
    background-size: auto;
    background-image: url(imagens/olaf.imagem.jpg);
    background-repeat: repeat-x;"
    width="300px";
    height="200px">
    
</div>

</body>
</html>
